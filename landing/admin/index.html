<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LandBrokers — Panel Admin</title>
    <link rel="icon" type="image/png" href="../assets/me.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-primary: #1a3a2e;
            --color-gold: #c9a84c;
            --color-light: #f8f6f1;
            --color-white: #ffffff;
            --color-danger: #c0392b;
            --color-muted: #888;
            --color-border: #e5e0d8;
            --font-body: 'Inter', sans-serif;
            --font-heading: 'Playfair Display', serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            background: var(--color-light);
            color: #333;
            min-height: 100vh;
        }

        /* ── Login ── */
        #login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--color-primary);
        }

        .login-box {
            background: var(--color-white);
            padding: 48px 40px;
            border-radius: 6px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .login-box h1 {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            color: var(--color-primary);
            margin-bottom: 6px;
        }

        .login-box p { color: var(--color-muted); font-size: 0.9rem; margin-bottom: 32px; }

        .login-box input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--color-border);
            border-radius: 4px;
            font-size: 1rem;
            font-family: var(--font-body);
            margin-bottom: 14px;
            outline: none;
            transition: border-color .2s;
        }

        .login-box input:focus { border-color: var(--color-gold); }

        .login-box button {
            width: 100%;
            padding: 13px;
            background: var(--color-primary);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-family: var(--font-body);
            font-weight: 600;
            cursor: pointer;
            transition: background .2s;
        }

        .login-box button:hover { background: #2a5040; }
        #login-error { color: var(--color-danger); font-size: 0.85rem; margin-top: 10px; }

        /* ── App shell ── */
        #app { display: none; }

        .topbar {
            background: var(--color-primary);
            color: #fff;
            padding: 0 24px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .topbar h1 { font-family: var(--font-heading); font-size: 1.3rem; color: var(--color-gold); }

        .topbar button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .tabs {
            background: var(--color-white);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            padding: 0 24px;
        }

        .tab-btn {
            padding: 14px 20px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            font-family: var(--font-body);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--color-muted);
            transition: all .2s;
        }

        .tab-btn.active {
            color: var(--color-primary);
            border-bottom-color: var(--color-gold);
        }

        .content { padding: 28px 24px; max-width: 1100px; }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* ── Buttons ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-family: var(--font-body);
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: background .2s;
        }

        .btn-primary { background: var(--color-primary); color: #fff; }
        .btn-primary:hover { background: #2a5040; }
        .btn-danger { background: var(--color-danger); color: #fff; }
        .btn-danger:hover { background: #a93226; }
        .btn-outline { background: transparent; border: 1px solid var(--color-border); color: #333; }
        .btn-outline:hover { background: var(--color-light); }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
        .btn-gold { background: var(--color-gold); color: var(--color-primary); }
        .btn-gold:hover { background: #b8962e; }

        /* ── Tables ── */
        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; background: var(--color-white); border-radius: 6px; overflow: hidden; min-width: 560px; }
        th { background: var(--color-primary); color: #fff; padding: 12px 16px; text-align: left; font-weight: 500; font-size: 0.85rem; }
        td { padding: 12px 16px; border-bottom: 1px solid var(--color-border); font-size: 0.9rem; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #faf9f6; }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-activo { background: #d4edda; color: #155724; }
        .badge-vendido { background: #f8d7da; color: #721c24; }
        .badge-proximamente { background: #fff3cd; color: #856404; }
        .badge-leido { background: #d4edda; color: #155724; }
        .badge-nuevo { background: #cce5ff; color: #004085; }
        .badge-remate { background: #e67e22; color: #fff; margin-left: 6px; }

        /* ── Modal ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--color-white);
            border-radius: 6px;
            width: 100%;
            max-width: 680px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 36px 32px;
        }

        .modal h2 { font-family: var(--font-heading); margin-bottom: 24px; color: var(--color-primary); }

        .form-row { margin-bottom: 16px; }
        .form-row label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 6px; color: #555; }
        .form-row input, .form-row textarea, .form-row select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--color-border);
            border-radius: 4px;
            font-size: 0.95rem;
            font-family: var(--font-body);
            outline: none;
            transition: border-color .2s;
        }
        .form-row input:focus, .form-row textarea:focus, .form-row select:focus { border-color: var(--color-gold); }
        .form-row textarea { min-height: 90px; resize: vertical; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .modal-footer { margin-top: 24px; display: flex; gap: 12px; justify-content: flex-end; }

        /* ── Features inline ── */
        .features-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        .feature-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 8px;
            align-items: start;
            background: var(--color-light);
            padding: 12px;
            border-radius: 4px;
        }

        /* ── Imágenes ── */
        .imagenes-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
            min-height: 20px;
        }

        .img-thumb {
            position: relative;
            width: 100px;
            height: 80px;
            border-radius: 4px;
            overflow: hidden;
            border: 2px solid var(--color-border);
            flex-shrink: 0;
        }

        .img-thumb.portada { border-color: var(--color-gold); }
        .img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .img-portada-badge {
            position: absolute;
            top: 2px; left: 2px;
            background: var(--color-gold);
            color: var(--color-primary);
            font-size: 0.6rem;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 2px;
            text-transform: uppercase;
        }

        .img-delete {
            position: absolute;
            top: 2px; right: 2px;
            background: rgba(192,57,43,0.9);
            border: none;
            color: #fff;
            border-radius: 2px;
            cursor: pointer;
            width: 20px; height: 20px;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .img-upload-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .img-upload-row input[type="file"] {
            font-size: 0.85rem;
            max-width: 220px;
        }

        /* ── Section header ── */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .section-header h2 { font-family: var(--font-heading); color: var(--color-primary); }

        #msg-toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--color-primary);
            color: #fff;
            padding: 12px 20px;
            border-radius: 4px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity .3s;
            z-index: 999;
            pointer-events: none;
        }

        #msg-toast.show { opacity: 1; }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .modal { padding: 24px 16px; }
            .content { padding: 16px; }
            .feature-row { grid-template-columns: 1fr auto; }
            .feature-row input:last-of-type { grid-column: 1; }
        }
    </style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
    <div class="login-box">
        <h1>Landbrokers.</h1>
        <p>Panel de administración</p>
        <input type="email" id="login-email" placeholder="Email" autocomplete="username">
        <input type="password" id="login-password" placeholder="Contraseña" autocomplete="current-password">
        <button onclick="doLogin()"><i class="fa-solid fa-right-to-bracket"></i> Ingresar</button>
        <div id="login-error"></div>
    </div>
</div>

<!-- App -->
<div id="app">
    <div class="topbar">
        <h1>Landbrokers Admin</h1>
        <div style="display:flex; gap:8px;">
            <button onclick="openModalPassword()"><i class="fa-solid fa-key"></i> Cambiar clave</button>
            <button onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Salir</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('proyectos', this)">
            <i class="fa-solid fa-building"></i> Proyectos
        </button>
        <button class="tab-btn" onclick="switchTab('leads', this)">
            <i class="fa-solid fa-envelope"></i> Leads <span id="leads-badge" style="display:none; background:var(--color-gold); color:var(--color-primary); border-radius:10px; padding:1px 7px; font-size:0.75rem; margin-left:6px;"></span>
        </button>
    </div>

    <div class="content">
        <!-- Tab Proyectos -->
        <div id="tab-proyectos" class="tab-panel active">
            <div class="section-header">
                <h2>Proyectos</h2>
                <button class="btn btn-primary" onclick="openModalCrear()">
                    <i class="fa-solid fa-plus"></i> Nuevo Proyecto
                </button>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Nombre</th>
                            <th>Ubicación</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="proyectos-tbody">
                        <tr><td colspan="5" style="text-align:center; color:var(--color-muted); padding:40px;">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Tab Leads -->
        <div id="tab-leads" class="tab-panel">
            <div class="section-header">
                <h2>Consultas recibidas</h2>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Teléfono</th>
                            <th>Proyecto</th>
                            <th>Mensaje</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="leads-tbody">
                        <tr><td colspan="7" style="text-align:center; color:var(--color-muted); padding:40px;">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
            <div id="leads-more" style="display:none; text-align:center; margin-top:16px;">
                <button class="btn btn-outline" onclick="cargarMasLeads()">
                    <i class="fa-solid fa-chevron-down"></i> Cargar más
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Proyecto -->
<div id="modal-proyecto" class="modal-overlay">
    <div class="modal">
        <h2 id="modal-title">Nuevo Proyecto</h2>

        <input type="hidden" id="proyecto-id">

        <div class="form-grid">
            <div class="form-row">
                <label>Nombre *</label>
                <input type="text" id="p-nombre" placeholder="Refugio Patagonia — Puerto Aysén">
            </div>
            <div class="form-row">
                <label>Slug (URL) *</label>
                <input type="text" id="p-slug" placeholder="refugio-patagonia">
            </div>
        </div>

        <div class="form-row">
            <label>Ubicación</label>
            <input type="text" id="p-ubicacion" placeholder="Patagonia Chilena / Puerto Aysén">
        </div>

        <div class="form-row">
            <label>Descripción</label>
            <textarea id="p-descripcion" placeholder="Texto descriptivo del proyecto..."></textarea>
        </div>

        <div class="form-grid">
            <div class="form-row">
                <label>Estado</label>
                <select id="p-estado">
                    <option value="activo">Activo</option>
                    <option value="vendido">Vendido</option>
                    <option value="proximamente">Próximamente</option>
                </select>
            </div>
            <div class="form-row">
                <label>Orden</label>
                <input type="number" id="p-orden" placeholder="1" min="0">
            </div>
        </div>

        <div class="form-row">
            <label>Link externo (opcional)</label>
            <input type="url" id="p-url-externa" placeholder="https://refugiopatagonia.cl/">
        </div>

        <div class="form-grid">
            <div class="form-row">
                <label>GPS Latitud</label>
                <input type="text" id="p-lat" placeholder="-45.9000">
            </div>
            <div class="form-row">
                <label>GPS Longitud</label>
                <input type="text" id="p-lng" placeholder="-72.7000">
            </div>
        </div>

        <!-- Datos comerciales -->
        <div style="margin-top:20px; margin-bottom:8px; border-top:1px solid var(--color-border); padding-top:16px;">
            <label style="font-weight:600; font-size:0.9rem;">Datos comerciales (opcionales, se muestran en la tarjeta)</label>
        </div>
        <div class="form-grid">
            <div class="form-row">
                <label>Precio desde (CLP)</label>
                <input type="number" id="p-precio-desde" placeholder="12500000" min="0">
            </div>
            <div class="form-row">
                <label>Superficie de lotes</label>
                <input type="text" id="p-superficie" placeholder="5.000 – 10.000 m²">
            </div>
        </div>
        <div class="form-grid">
            <div class="form-row">
                <label>Lotes totales</label>
                <input type="number" id="p-lotes-totales" placeholder="24" min="0">
            </div>
            <div class="form-row">
                <label>Lotes disponibles</label>
                <input type="number" id="p-lotes-disponibles" placeholder="18" min="0">
            </div>
        </div>

        <!-- Features -->
        <div style="margin-top:20px; margin-bottom:8px;">
            <label style="font-weight:600; font-size:0.9rem;">Características / Features</label>
        </div>
        <div class="features-list" id="features-list"></div>
        <button class="btn btn-outline btn-sm" onclick="addFeatureRow()">
            <i class="fa-solid fa-plus"></i> Agregar característica
        </button>

        <!-- Remate -->
        <div style="margin-top:20px; border-top:1px solid var(--color-border); padding-top:16px;">
            <label style="display:flex; align-items:center; gap:8px; font-weight:600; font-size:0.9rem; cursor:pointer;">
                <input type="checkbox" id="p-es-remate" onchange="toggleRemateFields()"> Es remate
            </label>
        </div>
        <div id="remate-fields" style="display:none; margin-top:14px;">
            <div class="form-grid">
                <div class="form-row">
                    <label>Fecha del remate *</label>
                    <input type="date" id="p-remate-fecha">
                </div>
                <div class="form-row">
                    <label>Precio mínimo (CLP) *</label>
                    <input type="number" id="p-remate-precio-minimo" placeholder="15000000" min="0">
                </div>
            </div>
            <div class="form-row">
                <label>Estado del remate</label>
                <select id="p-remate-estado">
                    <option value="programado">Programado</option>
                    <option value="en_curso">En curso</option>
                    <option value="adjudicado">Adjudicado</option>
                    <option value="suspendido">Suspendido</option>
                </select>
            </div>
        </div>

        <!-- Imágenes (visible solo al editar) -->
        <div id="imagenes-section" style="display:none; margin-top:28px; border-top:1px solid var(--color-border); padding-top:20px;">
            <label style="font-weight:600; font-size:0.9rem; display:block; margin-bottom:12px;">Imágenes del proyecto</label>
            <div class="imagenes-grid" id="imagenes-grid"></div>
            <div class="img-upload-row">
                <input type="file" id="img-file" accept="image/*">
                <label style="display:flex; align-items:center; gap:6px; font-size:0.85rem; cursor:pointer; white-space:nowrap;">
                    <input type="checkbox" id="img-portada"> Es portada
                </label>
                <button class="btn btn-gold btn-sm" onclick="uploadImagen()">
                    <i class="fa-solid fa-upload"></i> Subir imagen
                </button>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
            <button class="btn btn-primary" onclick="guardarProyecto()">
                <i class="fa-solid fa-floppy-disk"></i> Guardar
            </button>
        </div>
    </div>
</div>

<!-- Modal Cambiar Clave -->
<div id="modal-password" class="modal-overlay">
    <div class="modal" style="max-width:420px;">
        <h2>Cambiar contraseña</h2>
        <div class="form-row">
            <label>Contraseña actual</label>
            <input type="password" id="pw-actual" autocomplete="current-password">
        </div>
        <div class="form-row">
            <label>Nueva contraseña (mínimo 8 caracteres)</label>
            <input type="password" id="pw-nueva" autocomplete="new-password">
        </div>
        <div class="form-row">
            <label>Repetir nueva contraseña</label>
            <input type="password" id="pw-repetir" autocomplete="new-password">
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeModalPassword()">Cancelar</button>
            <button class="btn btn-primary" onclick="cambiarPassword()">
                <i class="fa-solid fa-key"></i> Cambiar
            </button>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="msg-toast"></div>

<script>
// ── Config ──
const API = 'https://api.landbrokers.cl';

function getToken() { return localStorage.getItem('lb_token'); }
function setToken(t) { localStorage.setItem('lb_token', t); }
function clearToken() { localStorage.removeItem('lb_token'); }

function authHeader() {
    return { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' };
}

// Escapa HTML antes de insertar datos en innerHTML.
// Crítico en leads: su contenido lo escribe cualquier visitante de la web.
function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
}

// "Refugio Puntra — Chiloé" → "refugio-puntra-chiloe"
function slugify(texto) {
    return texto
        .toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
}

function toast(msg, ok = true) {
    const el = document.getElementById('msg-toast');
    el.textContent = msg;
    el.style.background = ok ? 'var(--color-primary)' : 'var(--color-danger)';
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 3000);
}

// ── Auth ──
async function doLogin() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    errEl.textContent = '';

    try {
        const res = await fetch(`${API}/admin/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error al iniciar sesión');
        setToken(data.token);
        showApp();
    } catch (e) {
        errEl.textContent = e.message;
    }
}

function logout() {
    clearToken();
    document.getElementById('app').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
}

function showApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadProyectos();
    loadLeads();
}

// Auto-login si hay token
if (getToken()) showApp();

document.getElementById('login-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
});

// ── Tabs ──
function switchTab(name, btn) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`tab-${name}`).classList.add('active');
    btn.classList.add('active');
}

// ── Proyectos ──
let proyectosData = [];

async function loadProyectos() {
    try {
        const res = await fetch(`${API}/admin/proyectos`, { headers: authHeader() });
        if (res.status === 401) { logout(); return; }
        proyectosData = await res.json();
        renderProyectos();
    } catch {
        toast('Error cargando proyectos', false);
    }
}

function renderProyectos() {
    const tbody = document.getElementById('proyectos-tbody');
    if (!proyectosData.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--color-muted);padding:40px;">Sin proyectos aún. Crea el primero.</td></tr>';
        return;
    }
    tbody.innerHTML = proyectosData.map(p => `
        <tr>
            <td>${p.orden}</td>
            <td><strong>${esc(p.nombre)}</strong>${p.es_remate ? '<span class="badge badge-remate">Remate</span>' : ''}</td>
            <td>${esc(p.ubicacion) || '—'}</td>
            <td><span class="badge badge-${esc(p.estado)}">${esc(p.estado)}</span></td>
            <td>
                <button class="btn btn-outline btn-sm" onclick="openModalEditar('${p.id}')">
                    <i class="fa-solid fa-pen"></i> Editar
                </button>
                <button class="btn btn-danger btn-sm" style="margin-left:6px;" onclick="eliminarProyecto('${p.id}')">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </td>
        </tr>
    `).join('');
}

// El slug se autogenera desde el nombre mientras el usuario no lo haya tocado a mano
let slugEditadoAMano = false;

document.getElementById('p-slug').addEventListener('input', () => { slugEditadoAMano = true; });
document.getElementById('p-nombre').addEventListener('input', (e) => {
    const esNuevo = !document.getElementById('proyecto-id').value;
    if (esNuevo && !slugEditadoAMano) {
        document.getElementById('p-slug').value = slugify(e.target.value);
    }
});

function openModalCrear() {
    document.getElementById('modal-title').textContent = 'Nuevo Proyecto';
    document.getElementById('proyecto-id').value = '';
    ['nombre','slug','ubicacion','descripcion','url-externa','lat','lng','precio-desde','superficie','lotes-totales','lotes-disponibles'].forEach(f => {
        document.getElementById(`p-${f}`).value = '';
    });
    document.getElementById('p-estado').value = 'activo';
    document.getElementById('p-orden').value = '';
    document.getElementById('features-list').innerHTML = '';
    document.getElementById('imagenes-section').style.display = 'none';
    slugEditadoAMano = false;
    document.getElementById('p-es-remate').checked = false;
    document.getElementById('p-remate-fecha').value = '';
    document.getElementById('p-remate-precio-minimo').value = '';
    document.getElementById('p-remate-estado').value = 'programado';
    toggleRemateFields();
    addFeatureRow();
    document.getElementById('modal-proyecto').classList.add('open');
}

function toggleRemateFields() {
    const checked = document.getElementById('p-es-remate').checked;
    document.getElementById('remate-fields').style.display = checked ? 'block' : 'none';
}

async function openModalEditar(id) {
    try {
        const slug = proyectosData.find(p => p.id === id)?.slug || id;
        const res = await fetch(`${API}/api/proyectos/${slug}`);
        const p = await res.json();

        document.getElementById('modal-title').textContent = 'Editar Proyecto';
        document.getElementById('proyecto-id').value = p.id;
        document.getElementById('p-nombre').value = p.nombre || '';
        document.getElementById('p-slug').value = p.slug || '';
        document.getElementById('p-ubicacion').value = p.ubicacion || '';
        document.getElementById('p-descripcion').value = p.descripcion || '';
        document.getElementById('p-estado').value = p.estado || 'activo';
        document.getElementById('p-orden').value = p.orden ?? '';
        document.getElementById('p-url-externa').value = p.url_externa || '';
        document.getElementById('p-lat').value = p.gps_lat ?? '';
        document.getElementById('p-lng').value = p.gps_lng ?? '';
        document.getElementById('p-precio-desde').value = p.precio_desde ?? '';
        document.getElementById('p-superficie').value = p.superficie || '';
        document.getElementById('p-lotes-totales').value = p.lotes_totales ?? '';
        document.getElementById('p-lotes-disponibles').value = p.lotes_disponibles ?? '';
        slugEditadoAMano = true; // en edición nunca pisar el slug automáticamente

        document.getElementById('p-es-remate').checked = Boolean(p.es_remate);
        document.getElementById('p-remate-fecha').value = p.remate_fecha ? p.remate_fecha.slice(0, 10) : '';
        document.getElementById('p-remate-precio-minimo').value = p.remate_precio_minimo ?? '';
        document.getElementById('p-remate-estado').value = p.remate_estado || 'programado';
        toggleRemateFields();

        const fl = document.getElementById('features-list');
        fl.innerHTML = '';
        (p.proyecto_features || []).forEach(f => addFeatureRow(f.titulo, f.descripcion, f.id));
        if (!p.proyecto_features?.length) addFeatureRow();

        // Mostrar sección de imágenes y cargarlas
        document.getElementById('imagenes-section').style.display = 'block';
        document.getElementById('imagenes-grid').innerHTML = '<p style="color:var(--color-muted);font-size:0.85rem;">Cargando imágenes...</p>';
        document.getElementById('img-file').value = '';
        document.getElementById('img-portada').checked = false;
        loadImagenes(id, (p.proyecto_imagenes || []).sort((a,b) => a.orden - b.orden));

        document.getElementById('modal-proyecto').classList.add('open');
    } catch {
        toast('Error cargando proyecto', false);
    }
}

function closeModal() {
    document.getElementById('modal-proyecto').classList.remove('open');
}

function addFeatureRow(titulo = '', descripcion = '', featureId = '') {
    const list = document.getElementById('features-list');
    const row = document.createElement('div');
    row.className = 'feature-row';
    row.dataset.featureId = featureId;
    row.innerHTML = `
        <input type="text" placeholder="Título" value="${esc(titulo)}" style="padding:8px 10px; border:1px solid var(--color-border); border-radius:4px; font-family:var(--font-body);">
        <input type="text" placeholder="Descripción" value="${esc(descripcion)}" style="padding:8px 10px; border:1px solid var(--color-border); border-radius:4px; font-family:var(--font-body);">
        <button class="btn btn-danger btn-sm" onclick="this.closest('.feature-row').remove()">
            <i class="fa-solid fa-xmark"></i>
        </button>
    `;
    list.appendChild(row);
}

async function guardarProyecto() {
    const id = document.getElementById('proyecto-id').value;
    const body = {
        nombre: document.getElementById('p-nombre').value.trim(),
        slug: document.getElementById('p-slug').value.trim(),
        ubicacion: document.getElementById('p-ubicacion').value.trim(),
        descripcion: document.getElementById('p-descripcion').value.trim(),
        estado: document.getElementById('p-estado').value,
        orden: parseInt(document.getElementById('p-orden').value) || 0,
        url_externa: document.getElementById('p-url-externa').value.trim() || null,
        gps_lat: parseFloat(document.getElementById('p-lat').value) || null,
        gps_lng: parseFloat(document.getElementById('p-lng').value) || null,
        precio_desde: parseFloat(document.getElementById('p-precio-desde').value) || null,
        superficie: document.getElementById('p-superficie').value.trim() || null,
        lotes_totales: parseInt(document.getElementById('p-lotes-totales').value) || null,
        lotes_disponibles: parseInt(document.getElementById('p-lotes-disponibles').value) || null,
        es_remate: document.getElementById('p-es-remate').checked,
        remate_fecha: document.getElementById('p-remate-fecha').value || null,
        remate_precio_minimo: parseFloat(document.getElementById('p-remate-precio-minimo').value) || null,
        remate_estado: document.getElementById('p-remate-estado').value,
    };

    if (!body.nombre || !body.slug) {
        toast('Nombre y slug son requeridos', false);
        return;
    }

    if (body.es_remate && (!body.remate_fecha || !body.remate_precio_minimo)) {
        toast('Fecha del remate y precio mínimo son requeridos cuando "Es remate" está activo', false);
        return;
    }

    try {
        const method = id ? 'PUT' : 'POST';
        const url = id ? `${API}/admin/proyectos/${id}` : `${API}/admin/proyectos`;
        const res = await fetch(url, { method, headers: authHeader(), body: JSON.stringify(body) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        const proyId = data.id;

        // Features: una sola llamada que reemplaza el set completo (atómico, sin duplicados)
        const features = [...document.querySelectorAll('#features-list .feature-row')].map(row => {
            const inputs = row.querySelectorAll('input');
            return { titulo: inputs[0].value.trim(), descripcion: inputs[1].value.trim() };
        }).filter(f => f.titulo);

        const fRes = await fetch(`${API}/admin/proyectos/${proyId}/features`, {
            method: 'PUT',
            headers: authHeader(),
            body: JSON.stringify({ features })
        });
        if (!fRes.ok) {
            const fErr = await fRes.json();
            throw new Error(fErr.error || 'Proyecto guardado pero falló el guardado de características');
        }

        toast(id ? 'Proyecto actualizado' : 'Proyecto creado — ahora puedes editar las imágenes');
        closeModal();
        loadProyectos();
    } catch (e) {
        toast(e.message || 'Error al guardar', false);
    }
}

async function eliminarProyecto(id) {
    const nombre = proyectosData.find(p => p.id === id)?.nombre || 'este proyecto';
    if (!confirm(`¿Eliminar el proyecto "${nombre}"? Esta acción no se puede deshacer.`)) return;
    try {
        const res = await fetch(`${API}/admin/proyectos/${id}`, { method: 'DELETE', headers: authHeader() });
        if (!res.ok) throw new Error('Error al eliminar');
        toast('Proyecto eliminado');
        loadProyectos();
    } catch (e) {
        toast(e.message, false);
    }
}

// ── Imágenes ──
function loadImagenes(proyId, imagenes) {
    renderImagenes(proyId, imagenes);
}

function renderImagenes(proyId, imagenes) {
    const grid = document.getElementById('imagenes-grid');
    if (!imagenes.length) {
        grid.innerHTML = '<p style="color:var(--color-muted);font-size:0.85rem;">Sin imágenes. Sube la primera usando el botón de abajo.</p>';
        return;
    }
    grid.innerHTML = imagenes.map(img => `
        <div class="img-thumb ${img.es_portada ? 'portada' : ''}">
            <img src="${img.url}" alt="imagen proyecto">
            ${img.es_portada ? '<span class="img-portada-badge">portada</span>' : ''}
            <button class="img-delete" onclick="deleteImagen('${proyId}','${img.id}')">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    `).join('');
}

async function uploadImagen() {
    const proyId = document.getElementById('proyecto-id').value;
    if (!proyId) { toast('Guarda el proyecto primero para subir imágenes', false); return; }
    const file = document.getElementById('img-file').files[0];
    if (!file) { toast('Selecciona una imagen', false); return; }

    const formData = new FormData();
    formData.append('imagen', file);
    formData.append('es_portada', document.getElementById('img-portada').checked);
    formData.append('orden', document.querySelectorAll('#imagenes-grid .img-thumb').length);

    try {
        const res = await fetch(`${API}/admin/proyectos/${proyId}/imagenes`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${getToken()}` },
            body: formData
        });
        if (!res.ok) {
            const err = await res.json();
            throw new Error(err.error || 'Error al subir');
        }
        const data = await res.json();
        document.getElementById('img-file').value = '';
        document.getElementById('img-portada').checked = false;
        toast('Imagen subida');

        // Refrescar lista de imágenes desde la API
        const slug = proyectosData.find(p => p.id === proyId)?.slug;
        if (slug) {
            const pRes = await fetch(`${API}/api/proyectos/${slug}`);
            const pData = await pRes.json();
            renderImagenes(proyId, (pData.proyecto_imagenes || []).sort((a,b) => a.orden - b.orden));
        }
    } catch (e) {
        toast(e.message || 'Error al subir imagen', false);
    }
}

async function deleteImagen(proyId, imgId) {
    if (!confirm('¿Eliminar esta imagen?')) return;
    try {
        const res = await fetch(`${API}/admin/proyectos/${proyId}/imagenes/${imgId}`, {
            method: 'DELETE',
            headers: authHeader()
        });
        if (!res.ok) throw new Error('Error al eliminar');
        toast('Imagen eliminada');

        const slug = proyectosData.find(p => p.id === proyId)?.slug;
        if (slug) {
            const pRes = await fetch(`${API}/api/proyectos/${slug}`);
            const pData = await pRes.json();
            renderImagenes(proyId, (pData.proyecto_imagenes || []).sort((a,b) => a.orden - b.orden));
        }
    } catch (e) {
        toast(e.message, false);
    }
}

// ── Leads (paginados de a 100) ──
const LEADS_PAGE = 100;
let leadsCargados = [];
let leadsTotal = 0;

async function loadLeads() {
    leadsCargados = [];
    await fetchLeadsPage(0);
}

async function cargarMasLeads() {
    await fetchLeadsPage(leadsCargados.length);
}

async function fetchLeadsPage(offset) {
    try {
        const res = await fetch(`${API}/admin/leads?limit=${LEADS_PAGE}&offset=${offset}`, { headers: authHeader() });
        if (res.status === 401) { logout(); return; }
        const data = await res.json();

        leadsCargados = offset === 0 ? data.leads : leadsCargados.concat(data.leads);
        leadsTotal = data.total || 0;
        renderLeads(leadsCargados);

        document.getElementById('leads-more').style.display =
            leadsCargados.length < leadsTotal ? 'block' : 'none';

        const badge = document.getElementById('leads-badge');
        if (data.no_leidos > 0) { badge.textContent = data.no_leidos; badge.style.display = 'inline'; }
        else { badge.style.display = 'none'; }
    } catch {
        toast('Error cargando leads', false);
    }
}

function renderLeads(leads) {
    const tbody = document.getElementById('leads-tbody');
    if (!leads.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--color-muted);padding:40px;">Sin consultas aún.</td></tr>';
        return;
    }
    // IMPORTANTE: todos los campos van escapados con esc() — este contenido
    // lo escribe cualquier visitante anónimo de la web (riesgo de XSS almacenado).
    tbody.innerHTML = leads.map(l => {
        const fecha = new Date(l.created_at).toLocaleDateString('es-CL', { day: '2-digit', month: '2-digit', year: 'numeric' });
        return `
            <tr style="${!l.leido ? 'font-weight:600;' : ''}">
                <td>${fecha}</td>
                <td>${esc(l.nombre)}</td>
                <td><a href="mailto:${esc(l.email)}">${esc(l.email)}</a></td>
                <td>${esc(l.telefono) || '—'}</td>
                <td>${esc(l.proyectos?.nombre) || '—'}</td>
                <td style="max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${esc(l.mensaje)}">${esc(l.mensaje) || '—'}</td>
                <td>
                    <span class="badge badge-${l.leido ? 'leido' : 'nuevo'}">${l.leido ? 'Leído' : 'Nuevo'}</span>
                    ${!l.leido ? `<button class="btn btn-outline btn-sm" style="margin-left:6px;" onclick="marcarLeido('${l.id}')">Marcar leído</button>` : ''}
                </td>
            </tr>
        `;
    }).join('');
}

async function marcarLeido(id) {
    try {
        await fetch(`${API}/admin/leads/${id}/leido`, {
            method: 'PATCH',
            headers: authHeader(),
            body: JSON.stringify({ leido: true })
        });
        loadLeads();
    } catch {
        toast('Error actualizando lead', false);
    }
}

// ── Cambiar contraseña ──
function openModalPassword() {
    ['pw-actual','pw-nueva','pw-repetir'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('modal-password').classList.add('open');
}

function closeModalPassword() {
    document.getElementById('modal-password').classList.remove('open');
}

async function cambiarPassword() {
    const actual = document.getElementById('pw-actual').value;
    const nueva = document.getElementById('pw-nueva').value;
    const repetir = document.getElementById('pw-repetir').value;

    if (!actual || !nueva) { toast('Complete todos los campos', false); return; }
    if (nueva.length < 8) { toast('La nueva contraseña debe tener al menos 8 caracteres', false); return; }
    if (nueva !== repetir) { toast('Las contraseñas nuevas no coinciden', false); return; }

    try {
        const res = await fetch(`${API}/admin/password`, {
            method: 'PUT',
            headers: authHeader(),
            body: JSON.stringify({ actual, nueva })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        toast('Contraseña actualizada');
        closeModalPassword();
    } catch (e) {
        toast(e.message || 'Error al cambiar la contraseña', false);
    }
}

// Cerrar modales al hacer click fuera
document.getElementById('modal-proyecto').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});
document.getElementById('modal-password').addEventListener('click', function(e) {
    if (e.target === this) closeModalPassword();
});
</script>
